<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚽ Penalty Shootout - Desafío de Penales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #090e17;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    /* Barra superior de despliegue */
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
    }

    .badge-netlify {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 219, 182, 0.15);
      border: 1px solid #00dbb6;
      color: #00f0c8;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .badge-netlify .dot {
      width: 8px;
      height: 8px;
      background: #00dbb6;
      border-radius: 50%;
      box-shadow: 0 0 10px #00dbb6;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }

    .header-links a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .header-links a:hover {
      color: #fff;
    }

    /* Marcador estilo transmisión deportiva */
    .scoreboard-container {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }

    .scoreboard {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 6px 18px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .score-team {
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: 1px;
      color: #cbd5e1;
    }

    .score-numbers {
      font-family: 'Teko', sans-serif;
      font-size: 2.4rem;
      line-height: 1;
      color: #facc15;
      min-width: 60px;
      text-align: center;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.4);
    }

    /* Ronda de 5 penales */
    .penalties-track {
      display: flex;
      gap: 6px;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .penalty-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: all 0.3s;
    }
    .penalty-dot.goal {
      background: #22c55e;
      border-color: #4ade80;
      box-shadow: 0 0 8px #22c55e;
    }
    .penalty-dot.miss {
      background: #ef4444;
      border-color: #f87171;
      box-shadow: 0 0 8px #ef4444;
    }

    /* Estadio y Cancha */
    .stadium {
      position: relative;
      flex: 1;
      overflow: hidden;
      cursor: crosshair;
      perspective: 800px;
    }

    /* Gradas y público */
    .crowd {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 38%;
      background: linear-gradient(180deg, #020617 0%, #0f172a 40%, #1e293b 100%);
      overflow: hidden;
    }

    .crowd-lights {
      position: absolute;
      top: 10px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      opacity: 0.8;
    }

    .light-tower {
      width: 60px;
      height: 25px;
      background: radial-gradient(circle, #fff 10%, #38bdf8 60%, transparent 100%);
      filter: blur(4px);
    }

    .crowd-spectators {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 70%;
      background-image: 
        radial-gradient(circle, rgba(255,255,255,0.2) 1.5px, transparent 2px),
        radial-gradient(circle, rgba(250,204,21,0.2) 1.5px, transparent 2px),
        radial-gradient(circle, rgba(56,189,248,0.2) 1.5px, transparent 2px);
      background-size: 14px 14px, 18px 18px, 12px 12px;
      opacity: 0.45;
      animation: crowdBounce 2s infinite ease-in-out;
    }

    @keyframes crowdBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    /* Césped en perspectiva */
    .pitch {
      position: absolute;
      top: 38%;
      left: -20%;
      width: 140%;
      height: 62%;
      background: repeating-linear-gradient(
        0deg,
        #15803d 0px,
        #15803d 24px,
        #166534 24px,
        #166534 48px
      );
      transform: rotateX(55deg);
      transform-origin: top center;
      box-shadow: inset 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .pitch-lines {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 100%;
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-top: none;
    }

    .penalty-spot {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    /* Portería / Arco */
    .goal-container {
      position: absolute;
      top: 22%;
      left: 50%;
      transform: translateX(-50%);
      width: 380px;
      height: 170px;
      z-index: 10;
    }

    .goal-frame {
      position: absolute;
      width: 100%;
      height: 100%;
      border-top: 10px solid #f8fafc;
      border-left: 10px solid #f8fafc;
      border-right: 10px solid #f8fafc;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    }

    .goal-net {
      position: absolute;
      width: 100%;
      height: 100%;
      background: 
        repeating-linear-gradient(45deg, rgba(255,255,255,0.15) 0, rgba(255,255,255,0.15) 2px, transparent 2px, transparent 14px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,0.15) 0, rgba(255,255,255,0.15) 2px, transparent 2px, transparent 14px);
      background-color: rgba(2, 6, 23, 0.3);
      transition: transform 0.1s;
    }

    .goal-net.shake {
      animation: netShake 0.4s ease-out;
    }

    @keyframes netShake {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.04) translateY(-3px); }
      75% { transform: scale(0.98) translateY(2px); }
    }

    /* Arquero */
    .goalkeeper {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 64px;
      height: 105px;
      z-index: 15;
      transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: bottom center;
    }

    .gk-body {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Cabeza */
    .gk-head {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 22px;
      background: #fed7aa;
      border-radius: 50%;
      border: 2px solid #ea580c;
    }

    /* Torso */
    .gk-torso {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 42px;
      background: #f97316;
      border-radius: 8px 8px 4px 4px;
      border: 2px solid #c2410c;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
    }
    .gk-number {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      font-weight: 900;
      color: #fff;
    }

    /* Brazos y guantes */
    .gk-arm {
      position: absolute;
      top: 24px;
      width: 12px;
      height: 38px;
      background: #f97316;
      border-radius: 6px;
    }
    .gk-arm.left {
      left: 4px;
      transform: rotate(25deg);
    }
    .gk-arm.right {
      right: 4px;
      transform: rotate(-25deg);
    }
    .gk-glove {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      background: #facc15;
      border-radius: 50%;
      border: 2px solid #ca8a04;
    }

    /* Piernas */
    .gk-leg {
      position: absolute;
      bottom: 0;
      width: 12px;
      height: 45px;
      background: #1e293b;
      border-radius: 4px;
    }
    .gk-leg.left { left: 16px; }
    .gk-leg.right { right: 16px; }

    /* Animación reposo arquero */
    .goalkeeper.idle {
      animation: gkBounce 1.1s infinite ease-in-out alternate;
    }
    @keyframes gkBounce {
      0% { transform: translateX(-50%) translateY(0) scaleY(1); }
      100% { transform: translateX(-50%) translateY(5px) scaleY(0.96); }
    }

    /* Pelota de fútbol */
    .ball-container {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      width: 58px;
      height: 58px;
      z-index: 30;
      pointer-events: auto;
      cursor: grab;
      touch-action: none;
    }

    .ball {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e2e8f0 60%, #94a3b8 100%);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      transition: transform 0.05s linear;
    }

    /* Patrón de pentágonos en la pelota */
    .ball::before {
      content: '';
      position: absolute;
      top: 15%;
      left: 20%;
      width: 20px;
      height: 20px;
      background: #1e293b;
      clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    }
    .ball::after {
      content: '';
      position: absolute;
      bottom: 12%;
      right: 18%;
      width: 18px;
      height: 18px;
      background: #1e293b;
      clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
    }

    .ball-shadow {
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 14px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 50%;
      filter: blur(4px);
      z-index: 25;
      transition: all 0.05s linear;
    }

    /* Guía de disparo / flecha táctil */
    .aim-line {
      position: absolute;
      bottom: 100px;
      left: 50%;
      width: 4px;
      height: 0px;
      background: linear-gradient(to top, rgba(250, 204, 21, 0.9), rgba(239, 68, 68, 0.9));
      transform-origin: bottom center;
      border-radius: 4px;
      pointer-events: none;
      z-index: 28;
      display: none;
    }

    /* Mensaje de Resultado (¡GOL!, ATAJADA, etc.) */
    .result-banner {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-family: 'Teko', sans-serif;
      font-size: 5.5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      z-index: 60;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
    }

    .result-banner.show {
      transform: translate(-50%, -50%) scale(1);
    }

    .result-banner.goal {
      color: #22c55e;
      text-shadow: 0 0 25px rgba(34, 197, 94, 0.7);
    }
    .result-banner.saved {
      color: #f97316;
      text-shadow: 0 0 25px rgba(249, 115, 22, 0.7);
    }
    .result-banner.missed {
      color: #ef4444;
      text-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
    }

    /* Controles e instrucciones inferiores */
    .bottom-bar {
      background: #090e17;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
    }

    .instructions {
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .instructions strong {
      color: #facc15;
    }

    .btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      transform: translateY(-1px);
    }

    /* Modal Fin de Juego */
    .gameover-modal {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
    }
    .gameover-card {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 30px 40px;
      text-align: center;
      max-width: 380px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .gameover-card h2 {
      font-family: 'Teko', sans-serif;
      font-size: 3rem;
      color: #facc15;
      margin-bottom: 8px;
    }
    .gameover-card p {
      color: #94a3b8;
      margin-bottom: 20px;
      font-size: 1.05rem;
    }
  </style>
</head>

  <header>

  <!-- Marcador Deportivo -->
  <div class="scoreboard-container">

  <!-- Escena del Estadio -->
  <div class="stadium" id="stadium">
    <!-- Tribuna y Luces -->
    <div class="crowd">

    <!-- Campo de Juego con líneas -->
    <div class="pitch">

      <!-- Arquero -->

        <div class="gk-body">

  <!-- Barra Inferior -->

  <!-- Modal Fin de Tanda -->

      <button class="btn" style="width: 100%; justify-content: center; font-size: 1.1rem; padding: 12px;" onclick="resetShootout()">
        Jugar otra tanda
      </button>

  <!-- Audio Sintetizado (Web Audio API) y Lógica de Juego -->
  <script>
    // --- EFECTOS DE SONIDO SINTETIZADOS CON WEB AUDIO API ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioCtx();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Sonido de patada a la pelota
    function playKickSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    // Sonido de festejo de GOL (ovación del público)
    function playGoalCheer() {
      initAudio();
      // Ruido filtrado que simula la multitud gritando GOL
      const bufferSize = audioCtx.sampleRate * 1.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(450, audioCtx.currentTime);
      filter.Q.setValueAtTime(3, audioCtx.currentTime);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.4);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start();
    }

    // Sonido de atajada o palo
    function playMissSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(110, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    // --- VARIABLES Y ESTADO DEL JUEGO ---
    const ballContainer = document.getElementById('ballContainer');
    const ball = document.getElementById('ball');
    const ballShadow = document.getElementById('ballShadow');
    const goalkeeper = document.getElementById('goalkeeper');
    const goalNet = document.getElementById('goalNet');
    const aimLine = document.getElementById('aimLine');
    const resultBanner = document.getElementById('resultBanner');
    const scoreBoard = document.getElementById('scoreBoard');
    const goalContainer = document.getElementById('goalContainer');

    let currentShot = 0;
    let goalsScored = 0;
    let isShooting = false;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    // --- INTERACCIÓN DE ARRASTRAR / PATEAR ---
    function onPointerDown(e) {
      if (isShooting) return;
      initAudio();
      isDragging = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      dragStartX = clientX;
      dragStartY = clientY;

      aimLine.style.display = 'block';
      updateAimLine(clientX, clientY);
    }

    function onPointerMove(e) {
      if (!isDragging || isShooting) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      updateAimLine(clientX, clientY);
    }

    function updateAimLine(curX, curY) {
      const dx = curX - dragStartX;
      const dy = curY - dragStartY;
      const dist = Math.min(Math.hypot(dx, dy), 140);
      const angle = Math.atan2(dx, -dy) * (180 / Math.PI);

      aimLine.style.height = `${dist}px`;
      aimLine.style.transform = `translateX(-50%) rotate(${angle}deg)`;
    }

    function onPointerUp(e) {
      if (!isDragging || isShooting) return;
      isDragging = false;
      aimLine.style.display = 'none';

      const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;

      let dx = clientX - dragStartX;
      let dy = dragStartY - clientY; // hacia arriba es positivo

      // Si el arrastre fue muy corto, disparo predeterminado suave hacia arriba
      if (Math.hypot(dx, dy) < 20) {
        dx = (Math.random() - 0.5) * 60;
        dy = 80;
      }

      executeShot(dx, dy);
    }

    ballContainer.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    ballContainer.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    // --- EJECUCIÓN DEL TIRO Y FÍSICA ---
    function executeShot(powerX, powerY) {
      isShooting = true;
      playKickSound();

      // Cálculo de destino en el arco
      // Ancho del arco: aprox 360px (-180 a 180 desde el centro)
      // Alto del arco: aprox 150px
      const targetX = Math.max(-210, Math.min(210, powerX * 1.8));
      const targetY = Math.max(10, Math.min(180, powerY * 1.5));

      // El arquero decide dónde tirarse (IA)
      // Posibles zonas: 'left', 'right', 'center', 'top-left', 'top-right'
      const gkDecisions = ['left', 'right', 'center', 'top-left', 'top-right'];
      const gkChoice = gkDecisions[Math.floor(Math.random() * gkDecisions.length)];

      let gkTargetX = 0;
      let gkTargetY = 0;
      let gkAngle = 0;

      if (gkChoice === 'left') { gkTargetX = -100; gkAngle = -35; }
      else if (gkChoice === 'right') { gkTargetX = 100; gkAngle = 35; }
      else if (gkChoice === 'top-left') { gkTargetX = -110; gkTargetY = 45; gkAngle = -50; }
      else if (gkChoice === 'top-right') { gkTargetX = 110; gkTargetY = 45; gkAngle = 50; }

      // Salto del arquero
      goalkeeper.classList.remove('idle');
      goalkeeper.style.transform = `translateX(calc(-50% + ${gkTargetX}px)) translateY(-${gkTargetY}px) rotate(${gkAngle}deg)`;

      // Vuelo de la pelota hacia el fondo (perspectiva 3D con scale)
      const goalRect = goalContainer.getBoundingClientRect();
      const ballRect = ballContainer.getBoundingClientRect();
      const deltaY = (goalRect.bottom - targetY) - ballRect.top;

      ballContainer.style.transition = 'transform 0.55s cubic-bezier(0.1, 0.7, 0.4, 1)';
      ballContainer.style.transform = `translateX(calc(-50% + ${targetX}px)) translateY(${deltaY}px) scale(0.48)`;

      ballShadow.style.transition = 'all 0.55s cubic-bezier(0.1, 0.7, 0.4, 1)';
      ballShadow.style.transform = `translateX(calc(-50% + ${targetX}px)) translateY(${deltaY + 20}px) scale(0.3)`;
      ballShadow.style.opacity = '0.2';

      ball.style.transition = 'transform 0.55s linear';
      ball.style.transform = `rotate(${targetX * 3}deg)`;

      // Evaluación del tiro cuando llega al arco
      setTimeout(() => {
        resolveShot(targetX, targetY, gkTargetX, gkTargetY);
      }, 550);
    }

    function resolveShot(targetX, targetY, gkX, gkY) {
      // Dimensiones de los palos
      const insideGoal = Math.abs(targetX) <= 170 && targetY >= 15 && targetY <= 155;
      
      // Distancia entre pelota y arquero
      const distToGK = Math.hypot(targetX - gkX, targetY - (gkY + 30));
      const isSaved = insideGoal && distToGK < 65;

      const dot = document.getElementById(`dot-${currentShot}`);

      if (isSaved) {
        // ATAJADO
        playMissSound();
        showBanner('¡ATAJADA!', 'saved');
        dot.classList.add('miss');
      } else if (insideGoal) {
        // ¡GOL!
        playGoalCheer();
        goalNet.classList.add('shake');
        setTimeout(() => goalNet.classList.remove('shake'), 400);
        showBanner('¡GOLAZO! ⚽', 'goal');
        goalsScored++;
        dot.classList.add('goal');
      } else {
        // FUERA / DESVIADO
        playMissSound();
        showBanner('¡AFUERA!', 'missed');
        dot.classList.add('miss');
      }

      currentShot++;
      scoreBoard.textContent = `${goalsScored} - ${currentShot - goalsScored}`;

      // Esperar y resetear tiro o terminar la tanda
      setTimeout(() => {
        if (currentShot >= 5) {
          endShootout();
        } else {
          resetBallForNextShot();
        }
      }, 1600);
    }

    function showBanner(text, type) {
      resultBanner.textContent = text;
      resultBanner.className = `result-banner show ${type}`;
      setTimeout(() => {
        resultBanner.classList.remove('show');
      }, 1300);
    }

    function resetBallForNextShot() {
      // Devolver arquero a reposo
      goalkeeper.style.transform = 'translateX(-50%) translateY(0) rotate(0deg)';
      setTimeout(() => goalkeeper.classList.add('idle'), 300);

      // Devolver pelota
      ballContainer.style.transition = 'none';
      ballContainer.style.transform = 'translateX(-50%)';
      ballShadow.style.transition = 'none';
      ballShadow.style.transform = 'translateX(-50%)';
      ballShadow.style.opacity = '0.4';
      ball.style.transition = 'none';
      ball.style.transform = 'rotate(0deg)';

      isShooting = false;
    }

    function endShootout() {
      const modal = document.getElementById('gameoverModal');
      const title = document.getElementById('modalTitle');
      const desc = document.getElementById('modalDesc');

      if (goalsScored >= 3) {
        title.textContent = '¡CAMPEÓN! 🏆';
        desc.textContent = `¡Metiste ${goalsScored} de 5 penales! Excelente puntería.`;
      } else {
        title.textContent = '¡SEGUNDO PUESTO! 🥈';
        desc.textContent = `Metiste ${goalsScored} de 5 penales. El arquero estuvo inspirado.`;
      }
      modal.style.display = 'flex';
    }

    function resetShootout() {
      document.getElementById('gameoverModal').style.display = 'none';
      currentShot = 0;
      goalsScored = 0;
      scoreBoard.textContent = '0 - 0';
      for (let i = 0; i < 5; i++) {
        const dot = document.getElementById(`dot-${i}`);
        dot.className = 'penalty-dot';
      }
      resetBallForNextShot();
    }
  </script>
</body>
</html>
